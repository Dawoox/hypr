server {
    listen 80;
    server_name _;

    absolute_redirect off;

    root  /srv/site;
    index index.html;
    charset utf-8;

    # /blog -> /blog/ to match location rule below
    location = /blog { return 301 /blog/; }

    location ^~ /blog/ {
        alias /srv/blog/public/;
        index index.html;
    }

    location ^~ /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location = /static/rev.txt {
        internal;
    }

    location / {
        ssi on;
        ssi_last_modified on;
        try_files $uri $uri/ =404;
    }
}
