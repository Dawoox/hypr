server {
    listen 80;
    server_name _;

    absolute_redirect off;

    root  /srv/site;
    index index.html;
    charset utf-8;

    #error_page 404 /404.html;   # Zola writes public/404.html

    # /blog -> /blog/ to match location rule below
    location = /blog { return 301 /blog/; }

    # ^~ = skip regex locations for this prefix (see caveat table)
    location ^~ /blog/ {
        alias /srv/blog/public/;
        index index.html;
        add_header Cache-Control "no-cache";
    }

    location ^~ /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
